[package]
name = "panda-kernel"
version = "0.1.0"
edition = "2021"
publish = false
description = "Kernel Panda: a bare-metal microkernel in no_std Rust"

[[bin]]
name = "panda"
path = "src/main.rs"
test = false
bench = false

[lib]
name = "panda_kernel"
path = "src/lib.rs"
test = false
bench = false
# Doc-tests would be compiled and run on the host, where none of this links.
doctest = false

[features]
default = []
# Swap the linked-list heap for the bump allocator. Diagnostic aid: if `Box::new`
# faults under this, the fault is in the page mapping, not the allocator.
bump-allocator = []

# Every dependency here ships inside the kernel image and must earn its place
# against the auditability requirement. Three, and only three:
#   bootloader_api - mandated by the chosen boot path
#   x86_64         - IDT/GDT/page-table structures; pure Rust, no C
#   spin           - spinlocks, wrapped behind crate::sync so it can be swapped out
[dependencies]
bootloader_api = "0.11"
x86_64 = "0.15"
spin = { version = "0.9", default-features = false, features = [
    "spin_mutex",
    "once",
    "lazy",
] }

# Test targets keep cargo's default `harness = true`. That is what makes cargo
# pass `--test` to rustc, which is in turn what activates `custom_test_frameworks`
# and generates the `test_main` entry point. With `harness = false` the
# `#[test_case]` items are stripped and `test_main` never exists.
#
# The exception is a test that deliberately cannot return -- `stack_overflow` has
# no cases to collect, needs its own IDT, and ends by killing the VM.
[[test]]
name = "stack_overflow"
harness = false
